<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Frame</title><style>
*{box-sizing:border-box}body{margin:0;background:#020617;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.frame-root{width:360px;height:640px;max-width:100vw;max-height:100vh;aspect-ratio:9/16;overflow:hidden;position:relative;padding:26px 22px 24px;color:#f8fafc;background:radial-gradient(circle at 20% 10%,#1f2937 0,#020617 55%)}.theme-light{color:#111827;background:linear-gradient(160deg,#fff,#eef2ff 70%)}.theme-journal_brand{background:radial-gradient(circle at 80% 15%,#334155 0,#050505 58%)}.frame-root:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 74%)}.theme-light:before{background-image:linear-gradient(rgba(15,23,42,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.06) 1px,transparent 1px)}.frame-content{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;gap:14px}.badge{align-self:flex-start;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);font-size:10px;text-transform:uppercase;letter-spacing:.12em}.theme-light .badge{border-color:rgba(17,24,39,.14);background:rgba(17,24,39,.06)}.headline{font-size:29px;line-height:1.03;font-weight:820;letter-spacing:0;text-wrap:balance;margin:0}.body,.narration{font-size:15px;line-height:1.42;color:rgba(248,250,252,.82)}.theme-light .body,.theme-light .narration{color:rgba(17,24,39,.78)}.evidence{max-height:265px;overflow:hidden;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(2,6,23,.62)}.theme-light .evidence{background:rgba(255,255,255,.72);border-color:rgba(17,24,39,.14)}.evidence strong{display:block;font-size:12px;margin-bottom:6px}.evidence span{display:block;font-size:10px;line-height:1.25;opacity:.75}.evidence img,.evidence video{display:block;width:100%;max-height:190px;object-fit:contain;margin:6px 0;background:#fff;border-radius:6px}.evidence table{width:100%;border-collapse:collapse;font-size:10px}.evidence td{border-top:1px solid rgba(255,255,255,.16);padding:4px}.theme-light .evidence td{border-color:rgba(17,24,39,.12)}.key-points{margin:0;padding-left:18px;display:grid;gap:7px;font-size:13px;line-height:1.32}.key-points:empty{display:none}.generated-visual{position:relative;min-height:150px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.16);background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03));}.theme-light .generated-visual{border-color:rgba(17,24,39,.12);background:linear-gradient(135deg,rgba(17,24,39,.08),rgba(255,255,255,.62));}.visual-face{display:grid;place-items:center;}.face{position:relative;width:94px;height:94px;border-radius:999px;background:radial-gradient(circle at 34% 28%,#fff7ed,#fde68a 58%,#f59e0b);box-shadow:0 0 34px rgba(245,158,11,.45);animation:face-bob 3.2s ease-in-out infinite;}.eye{position:absolute;top:31px;width:11px;height:15px;border-radius:999px;background:#111827;}.eye-left{left:29px}.eye-right{right:29px}.smile{position:absolute;left:27px;right:27px;bottom:28px;height:18px;border-bottom:5px solid #111827;border-radius:0 0 999px 999px;}.visual-network .node{position:absolute;width:14px;height:14px;border-radius:999px;background:#fff;box-shadow:0 0 22px rgba(255,255,255,.65);}.node-1{left:16%;top:22%}.node-2{left:48%;top:15%}.node-3{right:18%;top:35%}.node-4{left:26%;bottom:24%}.node-5{right:28%;bottom:18%}.node-6{left:52%;top:52%}.visual-network .link{position:absolute;height:2px;background:rgba(255,255,255,.45);transform-origin:left center;}.link-1{left:19%;top:28%;width:34%;transform:rotate(-12deg)}.link-2{left:52%;top:24%;width:31%;transform:rotate(28deg)}.link-3{left:30%;bottom:32%;width:29%;transform:rotate(-28deg)}.link-4{left:55%;top:57%;width:25%;transform:rotate(30deg)}.link-5{left:29%;top:63%;width:42%;transform:rotate(4deg)}.visual-chart{display:flex;align-items:flex-end;justify-content:center;gap:9px;padding:26px 20px;}.visual-chart .bar{width:28px;border-radius:8px 8px 0 0;background:linear-gradient(to top,#38bdf8,#f8fafc);box-shadow:0 0 18px rgba(56,189,248,.25);}.bar-1{height:42px}.bar-2{height:74px}.bar-3{height:56px}.bar-4{height:102px}.bar-5{height:86px}.visual-abstract .orb{position:absolute;border-radius:999px;filter:blur(.5px);background:rgba(255,255,255,.8);animation:float 4s ease-in-out infinite alternate;}.orb-a{width:76px;height:76px;left:24px;top:24px}.orb-b{width:54px;height:54px;right:34px;top:48px;animation-delay:-1s}.orb-c{width:64px;height:64px;left:44%;bottom:26px;animation-delay:-2s}.path{position:absolute;left:28px;right:28px;bottom:46px;height:58px;border-bottom:5px solid rgba(255,255,255,.62);border-radius:0 0 60% 40%;transform:rotate(-7deg)}@keyframes face-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:10px;opacity:.66}.layout-title_hook .headline{font-size:33px;margin-top:auto}.layout-source_figure .body,.layout-source_table .body{display:none}.layout-impact_takeaway .headline{margin-top:auto}@keyframes fade-in-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}.anim-fade,.anim-slide_up{animation:fade-in-up 650ms ease-out both}
</style></head><body><section class="frame-root theme-{{ theme }} layout-{{ layout }} anim-{{ animation }}"><div class="frame-content"><div class="badge">{{ layout_label }}</div><h1 class="headline">{{ headline }}</h1><div class="body">{{ body }}</div>{{ generated_visual }}{{ evidence }}<ul class="key-points">{{ key_points }}</ul><div class="footer"><span>Infodemica</span><span>{{ accent_text }}</span></div></div></section></body></html>
