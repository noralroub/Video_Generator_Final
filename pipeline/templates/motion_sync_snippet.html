<!-- ── CSS: layout, typography, ambient, reveals, components ── -->
<style>
@keyframes orbDrift {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(24px, -32px) scale(1.08); }
  100% { transform: translate(-16px, 18px) scale(0.96); }
}
@keyframes kenBurns {
  from { transform: scale(1) translate(0, 0); }
  to { transform: scale(1.06) translate(-1.5%, -1%); }
}
@keyframes wordPop {
  0% { transform: scale(1); }
  40% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #050505;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #fff;
  overflow: hidden;
}
.stage {
  position: relative;
  width: min(100vw, 405px);
  aspect-ratio: 9 / 16;
  overflow: hidden;
  background: #000;
  border-radius: 18px;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
}
.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 56px 28px 92px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.55s ease, transform 0.55s ease;
  will-change: opacity, transform;
}
.scene.active {
  opacity: 1;
  visibility: visible;
}
.scene > *:not(.ambient) {
  position: relative;
  z-index: 1;
}

.ambient {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.ambient-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.3;
  animation: orbDrift 18s ease-in-out infinite alternate;
  transition: background 1.2s ease;
}

.headline {
  font-weight: 800;
  font-size: clamp(32px, 8vw, 46px);
  line-height: 1.05;
  letter-spacing: -0.03em;
  text-align: center;
  color: #fff;
  max-width: 100%;
  text-wrap: balance;
}
.subtext {
  font-weight: 400;
  font-size: clamp(14px, 3.8vw, 17px);
  line-height: 1.55;
  text-align: center;
  color: rgba(255, 255, 255, 0.62);
  max-width: 100%;
  text-wrap: balance;
}
.accent { color: var(--accent, #35d0ff); }

[data-reveal], .reveal-line {
  opacity: 0;
  transform: translateY(22px);
  transition:
    opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
}
[data-reveal].is-visible, .reveal-line.is-visible {
  opacity: 1;
  transform: translateY(0);
}
.emph {
  display: inline-block;
  font-weight: 700;
  color: var(--accent, #35d0ff);
}
[data-reveal].is-visible .emph {
  animation: wordPop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
[data-reveal].is-visible .emph + .emph {
  animation-delay: 0.08s;
}

.ken-burns img {
  animation: kenBurns 9s ease-in-out infinite alternate;
  transform-origin: center center;
}

.evidence-panel {
  width: 100%;
  max-height: 38%;
  flex-shrink: 0;
}
.figure-panel {
  width: 100%;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.04);
  text-align: center;
}
.figure-panel img {
  display: block;
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 10px;
}
.figure-panel .figure-label {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.45);
  margin-top: 8px;
}

.stat-counter {
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  font-size: clamp(48px, 12vw, 72px);
  line-height: 1;
  letter-spacing: -0.04em;
  color: var(--accent, #35d0ff);
  text-align: center;
}
.stat-counter-label {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.55);
  margin-top: 10px;
  text-align: center;
}

.stat-grid {
  display: flex;
  gap: 14px;
  width: 100%;
  justify-content: center;
}
.stat-grid-item {
  flex: 1;
  max-width: 140px;
  padding: 14px 10px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.04);
  text-align: center;
}
.stat-grid-val {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: clamp(26px, 6vw, 32px);
  color: var(--accent, #35d0ff);
}
.stat-grid-label {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.45);
  margin-top: 4px;
  line-height: 1.3;
}

.bar-chart {
  width: 100%;
}
.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.bar-label {
  flex: 0 0 72px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.45);
  text-align: right;
}
.bar-track {
  flex: 1;
  height: 28px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.06);
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  width: 0;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--accent, #35d0ff), color-mix(in srgb, var(--accent, #35d0ff) 60%, #fff));
  transition: width 1.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.mini-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.mini-table-wrap {
  width: 100%;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.04);
  overflow: hidden;
}
.mini-table th,
.mini-table td {
  padding: 6px 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  text-align: left;
}
.mini-table th {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.45);
  border-top: 0;
}

.narration-block {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
</style>

<!-- ── JS: audio-synced scene + reveals + orb palette + components ── -->
<script>
(function () {
  var narration = document.getElementById('narration');
  var scenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));
  var sceneDurations = __SCENE_DURATIONS_JSON__;
  var totalDuration = __TOTAL_DURATION_JSON__;
  var lastSceneIndex = -1;
  var playButton = document.querySelector('[data-play-toggle]') || document.querySelector('.play-button') || document.querySelector('.play');
  var progressBar = document.querySelector('[data-progress-bar]') || document.querySelector('.progress-fill');
  var timeEl = document.querySelector('[data-time]') || document.querySelector('.time');

  var orbPalettes = [
    ['rgba(255,107,53,0.28)', 'rgba(53,208,255,0.22)'],
    ['rgba(53,208,255,0.3)', 'rgba(53,255,176,0.18)'],
    ['rgba(255,51,85,0.28)', 'rgba(53,208,255,0.2)'],
    ['rgba(255,209,102,0.28)', 'rgba(255,107,53,0.16)'],
    ['rgba(99,102,241,0.28)', 'rgba(236,72,153,0.18)']
  ];

  function sceneIndexForTime(time) {
    var elapsed = 0;
    for (var i = 0; i < sceneDurations.length; i += 1) {
      elapsed += Number(sceneDurations[i]) || 0;
      if (time <= elapsed) return i;
    }
    return Math.max(0, scenes.length - 1);
  }

  function sceneStartTime(index) {
    var start = 0;
    for (var i = 0; i < index; i += 1) {
      start += Number(sceneDurations[i]) || 0;
    }
    return start;
  }

  function format(seconds) {
    seconds = Math.max(0, Math.floor(seconds || 0));
    return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  }

  function setActiveScene(index) {
    scenes.forEach(function (scene, i) {
      scene.classList.toggle('active', i === index);
    });
  }

  function shiftOrbPalette(index) {
    var scene = scenes[index];
    if (!scene) return;
    var orbs = scene.querySelectorAll('.ambient-orb');
    var palette = orbPalettes[index % orbPalettes.length];
    if (orbs[0]) {
      orbs[0].style.background = 'radial-gradient(circle,' + palette[0] + ',transparent 70%)';
    }
    if (orbs[1]) {
      orbs[1].style.background = 'radial-gradient(circle,' + palette[1] + ',transparent 70%)';
    }
  }

  function resetComponents(scene) {
    if (!scene) return;
    scene.querySelectorAll('[data-animate="bar"]').forEach(function (el) {
      el.style.width = '0';
    });
    scene.querySelectorAll('[data-animate="counter"]').forEach(function (el) {
      el.textContent = '0' + (el.getAttribute('data-suffix') || '');
    });
  }

  function animateCounter(el) {
    var target = parseFloat(el.getAttribute('data-target') || '0');
    var suffix = el.getAttribute('data-suffix') || '';
    var start = 0;
    var duration = 1800;
    var startTime = null;
    function step(ts) {
      if (!startTime) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      var val = Math.round(start + (target - start) * eased);
      el.textContent = val.toLocaleString() + suffix;
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function triggerComponents(sceneIndex) {
    var scene = scenes[sceneIndex];
    if (!scene) return;
    resetComponents(scene);
    requestAnimationFrame(function () {
      scene.querySelectorAll('[data-animate="bar"]').forEach(function (el) {
        var value = Math.min(100, Math.max(0, parseFloat(el.getAttribute('data-value') || '0')));
        el.style.width = value + '%';
      });
      scene.querySelectorAll('[data-animate="counter"]').forEach(function (el) {
        animateCounter(el);
      });
    });
  }

  function resetReveals() {
    document.querySelectorAll('[data-reveal], .reveal-line').forEach(function (el) {
      el.classList.remove('is-visible');
    });
  }

  function updateReveals(sceneIndex, currentTime) {
    var localMs = (currentTime - sceneStartTime(sceneIndex)) * 1000;
    var scene = scenes[sceneIndex];
    if (!scene) return;
    scene.querySelectorAll('[data-reveal], .reveal-line').forEach(function (el) {
      var enterMs = parseFloat(el.getAttribute('data-enter-ms') || '0');
      if (localMs >= enterMs) el.classList.add('is-visible');
    });
  }

  function update() {
    if (!narration || !scenes.length) return;
    var current = narration.currentTime || 0;
    var idx = sceneIndexForTime(current);
    if (idx !== lastSceneIndex) {
      lastSceneIndex = idx;
      resetReveals();
      setActiveScene(idx);
      shiftOrbPalette(idx);
      triggerComponents(idx);
    }
    updateReveals(idx, current);
    if (progressBar && totalDuration > 0) {
      progressBar.style.width = Math.min(100, (current / totalDuration) * 100) + '%';
    }
    if (timeEl) timeEl.textContent = format(current);
  }

  if (narration) {
    narration.addEventListener('timeupdate', update);
    narration.addEventListener('seeked', update);
    narration.addEventListener('ended', update);
  }
  if (playButton && narration) {
    playButton.addEventListener('click', function () {
      if (narration.paused) {
        narration.play();
        playButton.textContent = 'Ⅱ';
      } else {
        narration.pause();
        playButton.textContent = '▶';
      }
    });
  }
  setActiveScene(0);
  shiftOrbPalette(0);
  triggerComponents(0);
  update();
})();
</script>
